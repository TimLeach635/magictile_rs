<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Truncated order-5 square tiling</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="tiling"></canvas>
    <script type="module">
      import init, { start } from "./magictile.js";
      await init();
      await start(document.getElementById("tiling"), 4, 5);
    </script>
  </body>
</html>
