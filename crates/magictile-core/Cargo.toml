[package]
name = "magictile-core"
description = "MagicTile puzzle model: configuration, building, state and twisting"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
include_dir = "0.7.4"
r3.workspace = true
rand = "0.10.2"
rayon = { version = "1.12.0", optional = true }
roxmltree = "0.21.1"

[features]
default = ["parallel"]
# Parallel puzzle building (results are identical either way).
parallel = ["dep:rayon"]

[dev-dependencies]
rayon = "1.12.0"
