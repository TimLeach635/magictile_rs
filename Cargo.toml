[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
r3 = { path = "crates/r3" }
magictile-core = { path = "crates/magictile-core" }

# Interactive rendering is unusable unoptimised (wgpu especially), so debug builds optimise
# dependencies fully and our own code lightly. Debugging still works; release is still faster.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
